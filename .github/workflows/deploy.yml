# Deploys main to Vercel production and points bariweb.vercel.app at it.
# bariweb.vercel.app can't be attached as a project domain, so it is re-aliased on every deploy.
name: Deploy to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: vercel-production
  cancel-in-progress: false

env:
  VERCEL_ORG_ID: team_8MDWVAy4sxGwtGqOSHEVrl32
  VERCEL_PROJECT_ID: prj_m5Hw0LOISQzA3dCSyJkfEysVgD7q
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Deploy
        id: deploy
        run: |
          vercel deploy --prod --yes --token "$VERCEL_TOKEN" | tee deploy.log
          url=$(grep -oE 'https://bariweb-[a-z0-9]+-[a-z0-9-]+\.vercel\.app' deploy.log | head -1)
          test -n "$url"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      # REST instead of `vercel alias set`: the project-scoped token can't load the user the CLI asks for
      - name: Point bariweb.vercel.app at the new deployment
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
        run: |
          api="https://api.vercel.com"
          auth="Authorization: Bearer $VERCEL_TOKEN"
          id=$(curl -fsS -H "$auth" "$api/v13/deployments/${DEPLOY_URL#https://}?teamId=$VERCEL_ORG_ID" | jq -r .id)
          curl -fsS -X POST -H "$auth" -H 'content-type: application/json' \
            "$api/v2/deployments/$id/aliases?teamId=$VERCEL_ORG_ID" \
            -d '{"alias":"bariweb.vercel.app"}'

      - name: Smoke test
        run: |
          curl -fsS -o /dev/null https://bariweb.vercel.app/
          curl -fsS -o /dev/null https://bariweb.vercel.app/api/openapi.json
